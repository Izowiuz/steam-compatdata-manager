[package]
name = "steam-compatdata-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
indicatif = "0.18.4"
regex = "1.12.3"
walkdir = "2.5.0"
tabled = "0.20.0"
ureq = { version = "3.3.0", features = ["json"] }
serde_json = "1.0.149"
trash = "5.2.6"

[profile.release]
strip = true
lto = true
